<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案例检索 - AI法律助手</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* 案例检索页面特定样式 */
        .cases-container {
            padding: 20px;
            height: calc(100vh - 60px);
            overflow-y: auto;
        }

        /* 搜索区域样式 */
        .search-section {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .search-box {
            display: flex;
            margin-bottom: 20px;
        }

        #case-search-input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 4px 0 0 4px;
            font-size: 16px;
        }

        .search-btn {
            padding: 0 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
        }

        .search-btn:hover {
            background-color: #2980b9;
        }

        .search-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group label {
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }

        .filter-group select,
        .filter-group input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        /* 结果区域样式 */
        .results-section {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .results-count {
            font-size: 16px;
            color: #666;
        }

        #results-number {
            font-weight: bold;
            color: #3498db;
        }

        .sort-options {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sort-options label {
            font-weight: bold;
            color: #555;
        }

        #sort-by {
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        /* 案例卡片样式 */
        .case-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }

        .case-card {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
            background-color: #fafafa;
        }

        .case-card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateY(-3px);
        }

        .case-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .case-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #777;
        }

        .case-type,
        .case-court,
        .case-date {
            padding: 3px 8px;
            background-color: #e8f4fd;
            border-radius: 12px;
        }

        .case-content {
            font-size: 14px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 15px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .view-detail-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .view-detail-btn:hover {
            background-color: #2980b9;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 16px;
            grid-column: 1 / -1;
        }

        /* 快捷案例类型 */
        .quick-types {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .quick-types-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .type-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .type-card {
            text-align: center;
            padding: 20px 15px;
            border: 1px solid #eee;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #f9f9f9;
        }

        .type-card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-color: #3498db;
            background-color: #ebf5fb;
        }

        .type-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .type-name {
            font-weight: bold;
            color: #2c3e50;
        }

        /* 案例详情模态框 */
        .case-detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            overflow-y: auto;
        }

        .case-detail-content {
            background-color: white;
            border-radius: 8px;
            margin: 50px auto;
            padding: 30px;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .case-detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #3498db;
        }

        .case-detail-title {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }

        .close-detail {
            font-size: 28px;
            cursor: pointer;
            color: #999;
            transition: color 0.2s;
        }

        .close-detail:hover {
            color: #666;
        }

        .case-detail-body {
            line-height: 1.8;
            color: #333;
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section h4 {
            font-size: 16px;
            font-weight: bold;
            color: #3498db;
            margin-bottom: 10px;
        }

        .detail-content {
            padding-left: 20px;
        }

        .detail-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .detail-meta-item {
            padding: 5px 10px;
            background-color: #f0f0f0;
            border-radius: 15px;
            font-size: 14px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .search-filters {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-group {
                flex-direction: column;
                align-items: stretch;
            }

            .case-results {
                grid-template-columns: 1fr;
            }

            .case-detail-content {
                margin: 20px;
                padding: 20px;
            }
        }
    </style>
<body>

        <!-- 主内容区域 -->
        <div class="main-content" id="main-content">
            <div class="header">
                <button class="menu-btn" id="open-sidebar">☰</button>
                <h2>案例检索</h2>
            </div>
            
            <!-- 案例检索内容 -->
            <div class="cases-container">
                <!-- 快捷案例类型 -->
                <div class="quick-types">
                    <h3 class="quick-types-title">快捷案例类型</h3>
                    <div class="type-cards">
                        <div class="type-card" data-type="contract">
                            <div class="type-icon">📝</div>
                            <div class="type-name">合同纠纷</div>
                        </div>
                        <div class="type-card" data-type="labor">
                            <div class="type-icon">👥</div>
                            <div class="type-name">劳动纠纷</div>
                        </div>
                        <div class="type-card" data-type="property">
                            <div class="type-icon">🏠</div>
                            <div class="type-name">物权纠纷</div>
                        </div>
                        <div class="type-card" data-type="tort">
                            <div class="type-icon">⚖️</div>
                            <div class="type-name">侵权责任</div>
                        </div>
                        <div class="type-card" data-type="intellectual">
                            <div class="type-icon">💡</div>
                            <div class="type-name">知识产权</div>
                        </div>
                        <div class="type-card" data-type="family">
                            <div class="type-icon">👪</div>
                            <div class="type-name">婚姻家庭</div>

                </div>
                
                <!-- 搜索区域 -->
                <div class="search-section">
                    <div class="search-box">
                        <input type="text" id="case-search-input" placeholder="输入关键词搜索案例...">
                        <button class="search-btn">搜索</button>
                    </div>
                    <div class="search-filters">
                        <div class="filter-group">
                            <label for="case-type">案件类型:</label>
                            <select id="case-type">
                                <option value="all">全部类型</option>
                                <option value="contract">合同纠纷</option>
                                <option value="labor">劳动纠纷</option>
                                <option value="property">物权纠纷</option>
                                <option value="tort">侵权责任</option>
                                <option value="intellectual">知识产权</option>

                        <div class="filter-group">
                            <label for="case-year">年份范围:</label>
                            <select id="case-year">
                                <option value="all">全部年份</option>
                                <option value="2023">2023年</option>

                        <div class="filter-group">

                </div>
                
                <!-- 结果区域 -->
                <div class="results-section">

                        <div class="sort-options">
                            <label for="sort-by">排序方式:</label>
                            <select id="sort-by">
                                <option value="relevance">相关性</option>
                                <option value="time-desc">时间倒序</option>
                                <option value="time-asc">时间正序</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="case-results" id="case-results">
                        <!-- 案例列表将通过JavaScript动态生成 -->
                        <div class="no-results">请输入关键词进行搜索</div>
                    </div>
                </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 案例检索功能
            const searchBtn = document.querySelector('.search-btn');
            const caseSearchInput = document.getElementById('case-search-input');
            const caseResults = document.getElementById('case-results');
            const resultsNumber = document.getElementById('results-number');
            const sortBy = document.getElementById('sort-by');
            const caseTypeSelect = document.getElementById('case-type');
            const caseDetailModal = document.getElementById('case-detail-modal');
            const closeDetail = document.getElementById('close-detail');
            
            // 模拟案例数据（更丰富的案例详情）
            const mockCases = [
                {
                    id: 1,
                    title: '张三诉李四买卖合同纠纷案',
                    type: '合同纠纷',
                    court: '北京市朝阳区人民法院',
                    date: '2023-05-15',
                    content: '原告张三与被告李四于2022年10月签订买卖合同，约定被告向原告供应100台电子产品，总价50万元。后因被告未按约定交付货物，原告诉至法院，要求解除合同并赔偿损失。',
                    caseSummary: '2022年10月，原告张三与被告李四签订了一份电子产品买卖合同。合同约定，被告应于2023年1月30日前向原告交付100台电子产品，原告应在收到货物后3日内支付全部货款50万元。合同签订后，原告依约支付了10万元定金，但被告未按约定时间交付货物，经原告多次催告仍未履行合同义务。原告因此诉至法院，请求解除合同并要求被告双倍返还定金20万元及赔偿其他经济损失5万元。',
                    judgment: '法院经审理认为，原被告双方签订的买卖合同合法有效，双方均应严格履行合同义务。被告未按约定时间交付货物，已构成根本违约，原告有权解除合同。关于定金责任，根据《中华人民共和国民法典》第五百八十七条的规定，收受定金的一方不履行债务或者履行债务不符合约定，致使不能实现合同目的的，应当双倍返还定金。关于原告主张的其他经济损失，原告未能提供充分证据证明其实际损失，故法院不予支持。最终，法院判决解除原被告双方签订的买卖合同，被告李四双倍返还原告张三定金20万元。',
                    keyPoints: '1. 合同双方应严格履行合同义务，一方未履行主要义务构成根本违约的，另一方有权解除合同。\n2. 收受定金的一方不履行债务致使不能实现合同目的的，应当双倍返还定金。\n3. 主张经济损失的一方应当提供充分证据证明其实际损失。',
                    legalBasis: '1. 《中华人民共和国民法典》第五百六十三条：有下列情形之一的，当事人可以解除合同：（一）因不可抗力致使不能实现合同目的；（二）在履行期限届满前，当事人一方明确表示或者以自己的行为表明不履行主要债务；（三）当事人一方迟延履行主要债务，经催告后在合理期限内仍未履行；（四）当事人一方迟延履行债务或者有其他违约行为致使不能实现合同目的；（五）法律规定的其他情形。\n2. 《中华人民共和国民法典》第五百八十七条：债务人履行债务的，定金应当抵作价款或者收回。给付定金的一方不履行债务或者履行债务不符合约定，致使不能实现合同目的的，无权请求返还定金；收受定金的一方不履行债务或者履行债务不符合约定，致使不能实现合同目的的，应当双倍返还定金。'
                },
                {
                    id: 2,
                    title: '王五诉北京某科技公司劳动争议案',
                    type: '劳动纠纷',
                    court: '北京市海淀区人民法院',
                    date: '2023-03-22',
                    content: '原告王五主张其在被告公司工作期间，公司未依法缴纳社会保险，未支付加班工资，请求法院判决公司支付相应赔偿。',
                    caseSummary: '原告王五于2021年5月入职被告北京某科技公司，担任软件工程师，双方签订了为期三年的劳动合同，约定月工资为15000元。原告称，自入职以来，被告一直未为其缴纳社会保险，且经常要求其加班，但未依法支付加班工资。2023年2月，原告以被告未依法缴纳社会保险为由提出解除劳动合同，并向劳动仲裁委员会申请仲裁，要求被告支付解除劳动合同经济补偿金、加班工资及补缴社会保险。劳动仲裁委员会裁决支持了原告的部分请求，原告不服，诉至法院。',
                    judgment: '法院经审理认为，根据《中华人民共和国劳动法》和《中华人民共和国社会保险法》的规定，用人单位应当自用工之日起三十日内为其职工向社会保险经办机构申请办理社会保险登记，并按时足额缴纳社会保险费。被告未为原告缴纳社会保险的行为违反了法律规定，原告以此为由提出解除劳动合同符合法律规定，被告应当支付原告解除劳动合同经济补偿金。关于加班工资，原告提供了加班申请单、工作记录等证据，能够证明其存在加班事实，被告应当按照法律规定支付加班工资。最终，法院判决被告支付原告解除劳动合同经济补偿金30000元及加班工资15000元，并为原告补缴工作期间的社会保险。',
                    keyPoints: '1. 用人单位应当依法为劳动者缴纳社会保险费，未依法缴纳的，劳动者有权解除劳动合同并要求支付经济补偿金。\n2. 劳动者主张加班工资的，应当提供证据证明存在加班事实。\n3. 经济补偿金的计算标准为劳动者在本单位工作的年限，每满一年支付一个月工资的标准向劳动者支付。',

                    legalBasis: '1. 《中华人民共和国民法典》第一千一百六十五条：行为人因过错侵害他人民事权益造成损害的，应当承担侵权责任。依照法律规定推定行为人有过错，其不能证明自己没有过错的，应当承担侵权责任。\n2. 《中华人民共和国民法典》第一千一百七十三条：被侵权人对同一损害的发生或者扩大有过错的，可以减轻侵权人的责任。\n3. 《中华人民共和国民法典》第一千一百七十九条：侵害他人造成人身损害的，应当赔偿医疗费、护理费、交通费、营养费、住院伙食补助费等为治疗和康复支出的合理费用，以及因误工减少的收入。造成残疾的，还应当赔偿辅助器具费和残疾赔偿金；造成死亡的，还应当赔偿丧葬费和死亡赔偿金。\n4. 《中华人民共和国民法典》第一千一百八十三条：侵害自然人人身权益造成严重精神损害的，被侵权人有权请求精神损害赔偿。'

                {

                    caseSummary: '原告吴十是一名专业摄影师，其创作的一组摄影作品于2021年1月在某摄影网站上发表，并依法取得了著作权登记证书。2022年5月，原告发现被告郑十一在其经营的电子商务网站上，未经原告许可，使用了原告享有著作权的5张摄影作品作为商品宣传图片。原告多次要求被告停止侵权并赔偿损失，但被告均未予理会。2022年8月，原告诉至法院，请求判令被告立即停止侵权行为，并赔偿原告经济损失5万元及为制止侵权行为所支付的合理开支1万元。',

                    legalBasis: '1. 《中华人民共和国著作权法》第三条：本法所称的作品，是指文学、艺术和科学领域内具有独创性并能以一定形式表现的智力成果，包括：（一）文字作品；（二）口述作品；（三）音乐、戏剧、曲艺、舞蹈、杂技艺术作品；（四）美术、建筑作品；（五）摄影作品；（六）视听作品；（七）工程设计图、产品设计图、地图、示意图等图形作品和模型作品；（八）计算机软件；（九）符合作品特征的其他智力成果。\n2. 《中华人民共和国著作权法》第五十二条：有下列侵权行为的，应当根据情况，承担停止侵害、消除影响、赔礼道歉、赔偿损失等民事责任：（一）未经著作权人许可，发表其作品的；（二）未经合作作者许可，将与他人合作创作的作品当作自己单独创作的作品发表的；（三）没有参加创作，为谋取个人名利，在他人作品上署名的；（四）歪曲、篡改他人作品的；（五）剽窃他人作品的；（六）未经著作权人许可，以展览、摄制视听作品的方法使用作品，或者以改编、翻译、注释等方式使用作品的，本法另有规定的除外；（七）使用他人作品，应当支付报酬而未支付的；（八）未经视听作品、计算机软件、录音录像制品的著作权人、表演者或者录音录像制作者许可，出租其作品或者录音录像制品的原件或者复制件的，本法另有规定的除外；（九）未经出版者许可，使用其出版的图书、期刊的版式设计的；（十）未经表演者许可，从现场直播或者公开传送其现场表演，或者录制其表演的；（十一）其他侵犯著作权以及与著作权有关的权利的行为。\n3. 《中华人民共和国著作权法》第五十四条：侵犯著作权或者与著作权有关的权利的，侵权人应当按照权利人因此受到的实际损失或者侵权人的违法所得给予赔偿；权利人的实际损失或者侵权人的违法所得难以计算的，可以参照该权利使用费给予赔偿。对故意侵犯著作权或者与著作权有关的权利，情节严重的，可以在按照上述方法确定数额的一倍以上五倍以下给予赔偿。权利人的实际损失、侵权人的违法所得、权利使用费难以计算的，由人民法院根据侵权行为的情节，判决给予五百元以上五百万元以下的赔偿。赔偿数额还应当包括权利人为制止侵权行为所支付的合理开支。'

                    judgment: '法院经审理认为，原被告双方虽系自主婚姻，但婚后未能建立起真正的夫妻感情，且因家庭琐事经常发生争吵，导致夫妻感情逐渐恶化。原告提供的证据能够证明被告存在家庭暴力行为，根据《中华人民共和国民法典》第一千零七十九条第三款第（二）项的规定，实施家庭暴力或者虐待、遗弃家庭成员的，调解无效的，应当准予离婚。关于子女抚养问题，考虑到婚生女一直随原告生活，且年龄较小，从有利于子女健康成长的角度出发，婚生女由原告抚养为宜，被告应当支付相应的抚养费。关于夫妻共同财产的分割，法院根据财产的具体情况，按照照顾子女、女方和无过错方权益的原则判决。最终，法院判决准予原告陈十二与被告杨十三离婚；婚生女由原告抚养，被告每月支付抚养费1500元，直至婚生女年满十八周岁为止；位于成都市锦江区的房屋归原告所有，原告补偿被告房屋折价款30万元；轿车归被告所有；银行存款10万元由原被告各分得5万元。',
                    keyPoints: '1. 实施家庭暴力或者虐待、遗弃家庭成员的，调解无效的，应当准予离婚。\n2. 离婚后，子女的抚养权应当根据最有利于未成年子女的原则确定。\n3. 离婚时，夫妻的共同财产由双方协议处理；协议不成的，由人民法院根据财产的具体情况，按照照顾子女、女方和无过错方权益的原则判决。',
                    legalBasis: '1. 《中华人民共和国民法典》第一千零七十九条：夫妻一方要求离婚的，可以由有关组织进行调解或者直接向人民法院提起离婚诉讼。人民法院审理离婚案件，应当进行调解；如果感情确已破裂，调解无效的，应当准予离婚。有下列情形之一，调解无效的，应当准予离婚：（一）重婚或者与他人同居；（二）实施家庭暴力或者虐待、遗弃家庭成员；（三）有赌博、吸毒等恶习屡教不改；（四）因感情不和分居满二年；（五）其他导致夫妻感情破裂的情形。一方被宣告失踪，另一方提起离婚诉讼的，应当准予离婚。经人民法院判决不准离婚后，双方又分居满一年，一方再次提起离婚诉讼的，应当准予离婚。\n2. 《中华人民共和国民法典》第一千零八十四条：父母与子女间的关系，不因父母离婚而消除。离婚后，子女无论由父或者母直接抚养，仍是父母双方的子女。离婚后，父母对于子女仍有抚养、教育、保护的权利和义务。离婚后，不满两周岁的子女，以由母亲直接抚养为原则。已满两周岁的子女，父母双方对抚养问题协议不成的，由人民法院根据双方的具体情况，按照最有利于未成年子女的原则判决。子女已满八周岁的，应当尊重其真实意愿。\n3. 《中华人民共和国民法典》第一千零八十五条：离婚后，子女由一方直接抚养的，另一方应当负担部分或者全部抚养费。负担费用的多少和期限的长短，由双方协议；协议不成的，由人民法院判决。前款规定的协议或者判决，不妨碍子女在必要时向父母任何一方提出超过协议或者判决原定数额的合理要求。\n4. 《中华人民共和国民法典》第一千零八十七条：离婚时，夫妻的共同财产由双方协议处理；协议不成的，由人民法院根据财产的具体情况，按照照顾子女、女方和无过错方权益的原则判决。对夫或者妻在家庭土地承包经营中享有的权益等，应当依法予以保护。'
                }
            ];
            
            // 搜索功能
            function performSearch() {
                const keyword = caseSearchInput.value.trim().toLowerCase();
                const caseType = document.getElementById('case-type').value;
                const caseYear = document.getElementById('case-year').value;
                const caseCourt = document.getElementById('case-court').value.trim().toLowerCase();
                
                // 过滤案例
                let filteredCases = mockCases.filter(caseItem => {
                    let matchesKeyword = keyword === '' || caseItem.title.toLowerCase().includes(keyword) || caseItem.content.toLowerCase().includes(keyword) || caseItem.caseSummary.toLowerCase().includes(keyword);
                    let matchesType = caseType === 'all' || caseItem.type === caseType;
                    let matchesYear = caseYear === 'all' || caseItem.date.includes(caseYear);
                    let matchesCourt = caseCourt === '' || caseItem.court.toLowerCase().includes(caseCourt);
                    
                    return matchesKeyword && matchesType && matchesYear && matchesCourt;
                });
                
                // 排序
                const sortValue = sortBy.value;
                if (sortValue === 'time-desc') {
                    filteredCases.sort((a, b) => new Date(b.date) - new Date(a.date));
                } else if (sortValue === 'time-asc') {
                    filteredCases.sort((a, b) => new Date(a.date) - new Date(b.date));
                }
                // 默认按相关性排序（这里保持原顺序）
                
                // 更新结果数量
                resultsNumber.textContent = filteredCases.length;
                
                // 清空结果区域
                caseResults.innerHTML = '';
                
                // 如果有匹配的案例，显示它们
                if (filteredCases.length > 0) {
                    filteredCases.forEach(caseItem => {
                        const caseCard = document.createElement('div');
                        caseCard.className = 'case-card';
                        caseCard.innerHTML = `
                            <h4 class="case-title">${caseItem.title}</h4>
                            <div class="case-meta">
                                <span class="case-type">${caseItem.type}</span>
                                <span class="case-court">${caseItem.court}</span>
                                <span class="case-date">${caseItem.date}</span>
                            </div>
                            <p class="case-content">${caseItem.content}</p>
                            <button class="view-detail-btn" data-id="${caseItem.id}">查看详情</button>
                        `;
                        caseResults.appendChild(caseCard);
                    });
                    
                    // 添加查看详情按钮点击事件
                    document.querySelectorAll('.view-detail-btn').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const caseId = parseInt(this.getAttribute('data-id'));
                            const caseItem = mockCases.find(c => c.id === caseId);
                            if (caseItem) {
                                showCaseDetail(caseItem);
                            }
                        });
                    });
                } else {
                    // 如果没有匹配的案例，显示提示信息
                    const noResults = document.createElement('div');
                    noResults.className = 'no-results';
                    noResults.textContent = '没有找到匹配的案例';
                    caseResults.appendChild(noResults);
                }
            }
            
            // 显示案例详情
            function showCaseDetail(caseItem) {
                document.getElementById('detail-title').textContent = caseItem.title;
                document.getElementById('detail-type').textContent = caseItem.type;
                document.getElementById('detail-court').textContent = caseItem.court;
                document.getElementById('detail-date').textContent = caseItem.date;
                document.getElementById('detail-case').textContent = caseItem.caseSummary;
                document.getElementById('detail-judgment').textContent = caseItem.judgment;
                document.getElementById('detail-key-points').textContent = caseItem.keyPoints;
                document.getElementById('detail-legal-basis').textContent = caseItem.legalBasis;
                
                caseDetailModal.style.display = 'block';
            }
            
            // 快捷类型选择
            document.querySelectorAll('.type-card').forEach(card => {
                card.addEventListener('click', function() {
                    const typeValue = this.getAttribute('data-type');
                    caseTypeSelect.value = typeValue;
                    performSearch();
                });
            });
            
            // 添加搜索按钮点击事件
            searchBtn.addEventListener('click', performSearch);
            
            // 添加回车键搜索功能
            caseSearchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });
            
            // 排序方式变化事件
            sortBy.addEventListener('change', performSearch);
            
            // 关闭案例详情
            closeDetail.addEventListener('click', function() {
                caseDetailModal.style.display = 'none';
            });
            
            // 点击模态框外部关闭
            caseDetailModal.addEventListener('click', function(e) {
                if (e.target === caseDetailModal) {
                    caseDetailModal.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
